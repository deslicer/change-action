name: Deslicer Change
description: Install the Deslicer CLI from signed releases and run deslicer change commands.
author: Deslicer
branding:
  icon: git-branch
  color: blue

inputs:
  version:
    description: 'CLI version: "v1" (floating), "v1.2.3" (immutable), or a 40-char SHA. Default "v1".'
    required: false
    default: v1
  version-sha:
    description: Optional 40-char SHA. If set, overrides version and pins to an immutable commit.
    required: false
  command:
    description: deslicer change subcommand (e.g. plan, approve, status). Omit to install only.
    required: false
    default: ''
  command-args:
    description: Additional arguments passed to deslicer change.
    required: false
    default: ''
  observer-api-url:
    description: Optional. Sets $OBSERVER_API_URL for the CLI.
    required: false
  api-token:
    description: >-
      Optional Observer API token for direct (App-free) mode. Exported to the
      CLI as $DESLICER_API_TOKEN and masked in logs — never passed as an
      argument. Use a repository or environment secret.
    required: false
  github-token:
    description: >-
      Optional GitHub token for resolving deslicer/cli releases via the API.
      Pass the workflow github.token value to avoid unauthenticated rate
      limits. Not forwarded to the CLI.
    required: false

outputs:
  cli-version:
    description: Semver of the deslicer binary that was installed.
  cli-path:
    description: Absolute path to the installed deslicer binary.
  plan_id:
    description: External plan id from the deslicer change command (when command is set).
  plan_row_id:
    description: Internal plan row id from the deslicer change command.
  plan_status:
    description: Plan lifecycle status (draft, pending_approval, approved, etc.).
  plan_summary:
    description: Human-readable plan summary including change counts when available.
  diff_total:
    description: Total change items from the dry-run diff.
  diff_additions:
    description: Number of additions in the dry-run diff.
  diff_modifications:
    description: Number of modifications in the dry-run diff.
  diff_deletions:
    description: Number of deletions in the dry-run diff.
  diff_has_destructive:
    description: Whether the dry-run diff includes deletions.
  progress_status:
    description: Item-completion progress status from change status.
  total_items:
    description: Total change items from change status.
  fully_completed_items:
    description: Items fully completed on every target host.
  execution_id:
    description: Execution id from change deploy.
  execution_status:
    description: Execution status from change deploy.
  jobs_total:
    description: Total jobs in the execution.
  jobs_succeeded:
    description: Jobs that completed successfully.
  jobs_failed:
    description: Jobs that failed.

runs:
  using: node24
  main: dist/index.js
